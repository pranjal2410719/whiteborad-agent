[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-agent"
version = "0.1.0"
description = "Whiteboard AI Agent with Spatial Memory, Target Geometry, and Universal LLM Tool Support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
]

[project.scripts]
whiteboard-agent = "whiteboard_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["whiteboard_agent*"]
