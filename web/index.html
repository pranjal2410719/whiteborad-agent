<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whiteboard AI Agent · Live Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Fira+Code:wght@400;500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="/mermaid.min.js"></script>
  <script src="/bridge.js"></script>
  <script>
    if (!window.mermaid) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
      document.head.appendChild(s);
    }
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --board-bg: #fcfcfd;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-subtle: #eff6ff;
      --danger: #ef4444;
      --grid-dot: #cbd5e1;
      --marker-black: #0f172a;
      --marker-blue: #1d4ed8;
      --marker-red: #dc2626;
      --marker-green: #15803d;
      --marker-purple: #7e22ce;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    .app-layout {
      display: grid;
      grid-template-rows: 52px 1fr;
      height: 100vh;
    }
    header {
      background: #ffffff;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1e293b;
    }
    .badge {
      background: var(--primary-subtle);
      color: var(--primary);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .agent-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .workspace-area {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: calc(100vh - 52px);
      position: relative;
    }

    /* Infinite Whiteboard Canvas (Zero cards, direct pen drawing feel) */
    #board {
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
      background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      cursor: crosshair;
      user-select: none;
    }
    #board.panning { cursor: grabbing; }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    #world.no-anim { transition: none; }

    #ink {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: visible;
      pointer-events: none;
      z-index: 50;
    }

    /* PURE INK DRAWINGS — ZERO CARDS, ZERO BORDERS, ZERO SHADOWS */
    .wb-obj {
      position: absolute;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      cursor: default;
    }

    /* Direct Ink Formula */
    .ink-formula-wrap {
      padding: 4px 6px;
      display: inline-block;
    }
    .ink-math {
      font-family: 'Caveat', 'Georgia', cursive, serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--marker-black);
      line-height: 1.1;
      letter-spacing: 0.03em;
      white-space: nowrap;
      text-shadow: 0 0 1px rgba(15, 23, 42, 0.3);
    }
    .ink-steps {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .ink-step {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 19px;
      color: #334155;
      letter-spacing: 0.02em;
    }

    /* Direct Ink Text */
    .ink-text {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--marker-black);
      line-height: 1.2;
    }

    /* Direct Ink Sticky Note (Simple flat paper or marker note) */
    .ink-note {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 20px;
      color: #1e293b;
      padding: 12px 14px;
      background: #fef08a !important;
      border: 1px solid #fde047 !important;
      border-radius: 2px 2px 14px 2px !important;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.06) !important;
      transform: rotate(-1deg);
      line-height: 1.35;
    }
    .ink-note-title {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #854d0e;
      margin-bottom: 4px;
    }

    /* Direct Ink Diagram (Drawn pen sketch boxes) */
    .ink-diagram {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .ink-node-box {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 20px;
      color: var(--marker-blue);
      border: 2.5px solid var(--marker-blue) !important;
      border-radius: 8px !important;
      padding: 6px 16px;
      text-align: center;
      background: transparent;
    }
    .ink-down-arrow {
      color: var(--marker-blue);
      font-size: 20px;
      line-height: 1;
      font-weight: bold;
    }

    /* Mermaid Marker Whiteboard Integration */
    .ink-mermaid-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .ink-mermaid-title {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--marker-blue);
      margin-bottom: 6px;
      text-align: center;
    }
    .mermaid-diagram-box {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .mermaid-diagram-box svg {
      background: transparent !important;
      font-family: 'Patrick Hand', 'Caveat', cursive, sans-serif !important;
    }
    .mermaid-diagram-box .node rect,
    .mermaid-diagram-box .node circle,
    .mermaid-diagram-box .node ellipse,
    .mermaid-diagram-box .node polygon {
      stroke-width: 2.2px !important;
      rx: 8px !important;
      ry: 8px !important;
    }
    .mermaid-diagram-box .edgePath .path {
      stroke-width: 2.5px !important;
    }
    .mermaid-diagram-box .label {
      font-family: 'Patrick Hand', cursive, sans-serif !important;
      font-size: 18px !important;
    }

    /* Direct Ink Graph (Drawn axes and curve) */
    .ink-graph-title {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--marker-purple);
      margin-bottom: 2px;
    }

    /* Direct Ink Annotation */
    .ink-annotation {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 20px;
      color: var(--marker-purple);
      font-weight: bold;
      white-space: nowrap;
    }

    /* Debug Bounds (Hidden by default) */
    .wb-debug-box {
      border: 1px dashed rgba(239, 68, 68, 0.4) !important;
    }
    .wb-debug-tag {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      color: #ef4444;
      background: #fee2e2;
      position: absolute;
      top: -14px;
      left: 0;
      padding: 1px 4px;
    }

    /* Sidebar Control Panel */
    .sidebar {
      background: #ffffff;
      border-left: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1.5px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.danger { color: var(--danger); }
    .btn.accent { background: #10b981; color: #fff; border-color: #10b981; }
    .btn.accent:hover { background: #059669; }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .panel-box {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
    }
    .panel-box h4 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .spatial-info {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.45;
      color: #334155;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Floating Toolbar */
    .floating-bar {
      position: absolute;
      left: 16px;
      bottom: 72px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      z-index: 40;
    }
    .floating-bar .btn { padding: 6px 12px; font-size: 12px; }

    /* Bottom Live Command Bar */
    .command-bar {
      position: absolute;
      left: 16px;
      bottom: 12px;
      right: 336px;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
      z-index: 40;
    }
    .command-bar input {
      flex: 1;
      border: none;
      outline: none;
      font: inherit;
      font-size: 14px;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <header>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M13.5 6.5l3 3"/></svg>
        <span>Whiteboard AI Agent</span>
        <span class="badge">Pure Pen Canvas</span>
      </div>
      <div class="header-actions">
        <button class="btn accent" style="padding: 6px 14px; font-size: 12px;" onclick="fitView()">Fit Content to Screen</button>
        <div class="agent-status">
          <div class="dot"></div>
          <span id="conn-status">Connected</span>
        </div>
      </div>
    </header>

    <div class="workspace-area">
      <!-- Direct Pen Whiteboard Canvas -->
      <div id="board">
        <div id="world">
          <svg id="ink" aria-hidden="true"></svg>
        </div>

        <div class="floating-bar">
          <button class="btn primary" onclick="fitView()">Fit View</button>
          <button class="btn" onclick="zoomBoard(1.25)">+ Zoom</button>
          <button class="btn" onclick="zoomBoard(0.8)">- Zoom</button>
          <button class="btn" onclick="resetCenter()">Center</button>
          <button class="btn" onclick="toggleDebug()">Bounds</button>
        </div>

        <form class="command-bar" id="cli-form" onsubmit="handleCliSubmit(event)">
          <span style="font-weight: 700; color: var(--primary);">Pen &gt;</span>
          <input type="text" id="cli-input" placeholder="Draw on board (e.g. 'formula Pythagoras | a² + b² = c²', 'underline', 'circle', 'note Tip | Text')..." />
          <button type="submit" class="btn primary" style="padding: 6px 14px; font-size: 13px;">Draw</button>
        </form>
      </div>

      <!-- Control Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span>Whiteboard Drawing Tools</span>
          <button class="btn danger" style="padding: 4px 8px; font-size: 11px;" onclick="executeAction('clear_canvas')">Wipe Board</button>
        </div>
        <div class="sidebar-content">
          <div class="panel-box">
            <h4>Quick Pen Actions</h4>
            <div class="tool-grid">
              <button class="btn" onclick="testAddFormula()">Formula</button>
              <button class="btn" onclick="testAddSticky()">Sticky</button>
              <button class="btn" onclick="testAddMermaid()">Mermaid</button>
              <button class="btn" onclick="testAddDiagram()">Diagram</button>
              <button class="btn" onclick="testAddGraph()">Graph</button>
              <button class="btn" onclick="testUnderline()">Underline</button>
              <button class="btn" onclick="testCircle()">Circle</button>
              <button class="btn" onclick="testArrow()">Arrow</button>
              <button class="btn" onclick="testAnnotate()">Annotate</button>
            </div>
          </div>

          <div class="panel-box">
            <h4>Spatial Memory (Canvas State)</h4>
            <div id="spatial-digest" class="spatial-info">Loading active drawings...</div>
          </div>

          <div class="panel-box">
            <h4>Full Lesson Blueprint</h4>
            <button class="btn primary" style="width: 100%; margin-top: 4px;" onclick="runTeachingLesson()">Draw Complete Lesson</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const world = document.getElementById('world');
    const ink = document.getElementById('ink');

    const bridge = new WhiteboardBridge({
      boardEl: board,
      worldEl: world,
      svgInkEl: ink,
      apiUrl: window.location.origin,
      wsUrl: `ws://${window.location.host}/ws`,
      onStateChange: updateSpatialDigest
    });
    window.bridge = bridge;

    // Reset center to (0, 0)
    function resetCenter() {
      const cx = board.clientWidth / 2;
      const cy = board.clientHeight / 2;
      bridge.setViewport({ x: cx, y: cy, zoom: 1.0 }, true);
    }

    // Auto-fit all drawings neatly onto visible screen
    function fitView() {
      const objs = Array.from(bridge.elements.values());
      if (!objs.length) {
        return resetCenter();
      }

      let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      objs.forEach(el => {
        minX = Math.min(minX, el.bounds.x);
        minY = Math.min(minY, el.bounds.y);
        maxX = Math.max(maxX, el.bounds.x + el.bounds.width);
        maxY = Math.max(maxY, el.bounds.y + el.bounds.height);
      });

      const contentW = Math.max(120, maxX - minX);
      const contentH = Math.max(120, maxY - minY);
      const cx = (minX + maxX) / 2.0;
      const cy = (minY + maxY) / 2.0;

      const screenW = Math.max(300, board.clientWidth - 160);
      const screenH = Math.max(300, board.clientHeight - 180);

      const zoom = Math.max(0.35, Math.min(1.35, Math.min(screenW / contentW, screenH / contentH)));
      const viewX = (board.clientWidth / 2.0) - (cx * zoom);
      const viewY = (board.clientHeight / 2.0) - (cy * zoom);

      bridge.setViewport({ x: viewX, y: viewY, zoom: zoom }, true);
    }
    window.fitView = fitView;

    // Pan & zoom handlers
    let isPanning = false, panStart = { x: 0, y: 0 };

    board.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.floating-bar, .command-bar, button, input')) return;
      isPanning = true;
      board.classList.add('panning');
      world.classList.add('no-anim');
      panStart = { x: e.clientX - bridge.viewport.x, y: e.clientY - bridge.viewport.y };
    });
    window.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      bridge.viewport.x = e.clientX - panStart.x;
      bridge.viewport.y = e.clientY - panStart.y;
      bridge.setViewport(bridge.viewport, false);
    });
    window.addEventListener('pointerup', () => {
      isPanning = false;
      board.classList.remove('panning');
      world.classList.remove('no-anim');
    });

    board.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 0.85;
      zoomBoard(factor);
    }, { passive: false });

    function zoomBoard(factor) {
      const newZoom = Math.max(0.2, Math.min(3.0, bridge.viewport.zoom * factor));
      bridge.setViewport({ zoom: newZoom }, false);
    }

    function toggleDebug() {
      bridge.showSpatialBounds = !bridge.showSpatialBounds;
      bridge.fetchState();
    }

    async function executeAction(tool, args = {}) {
      const res = await bridge.executeTool(tool, args);
      setTimeout(fitView, 120);
      return res;
    }

    // Command bar parser
    async function handleCliSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('cli-input');
      const line = input.value.trim();
      if (!line) return;
      input.value = '';

      const cmd = line.split(' ')[0].toLowerCase();
      const args = line.substring(cmd.length).trim();
      const lastId = getLastElementId();

      if (cmd === 'formula') {
        const parts = args.split('|').map(s => s.trim());
        const title = parts.length > 1 ? parts[0] : 'Formula';
        const formula = parts.length > 1 ? parts[1] : parts[0];
        await executeAction('create_formula', { title, formula });
      } else if (cmd === 'note') {
        const parts = args.split('|').map(s => s.trim());
        const title = parts.length > 1 ? parts[0] : 'Note';
        const content = parts.length > 1 ? parts[1] : parts[0];
        await executeAction('create_sticky_note', { title, content });
      } else if (cmd === 'underline') {
        let target = lastId;
        let word = null;
        if (args) {
          const tokens = args.split(' ');
          if (['eq-', 'txt-', 'note-', 'geom-', 'diag-', 'plot-', 'hint-'].some(p => tokens[0].startsWith(p))) {
            target = tokens[0];
            word = tokens.slice(1).join(' ') || null;
          } else {
            word = args;
          }
        }
        if (!target) return alert('No element to underline! Draw an element first.');
        await executeAction('underline_element', { target_id: target, target_text: word });
      } else if (cmd === 'circle') {
        let target = lastId;
        let word = null;
        if (args) {
          const tokens = args.split(' ');
          if (['eq-', 'txt-', 'note-', 'geom-', 'diag-', 'plot-', 'hint-'].some(p => tokens[0].startsWith(p))) {
            target = tokens[0];
            word = tokens.slice(1).join(' ') || null;
          } else {
            word = args;
          }
        }
        if (!target) return alert('No element to circle! Draw an element first.');
        await executeAction('circle_element', { target_id: target, target_text: word });
      } else if (cmd === 'arrow') {
        const tokens = args.split(' ');
        if (tokens.length < 2) return alert('Usage: arrow <from_id> <to_id>');
        await executeAction('draw_arrow', { from_id: tokens[0], to_id: tokens[1] });
      } else if (cmd === 'mermaid') {
        const parts = args.split('|').map(s => s.trim());
        const title = parts.length > 1 ? parts[0] : 'Flowchart';
        const code = parts.length > 1 ? parts.slice(1).join('|') : parts[0];
        await executeAction('create_mermaid', { title, code });
      } else if (cmd === 'clear') {
        await executeAction('clear_canvas');
      } else {
        await executeAction('write_text', { title: 'Note', text: line });
      }
    }

    // Quick test actions
    async function testAddMermaid() {
      await executeAction('create_mermaid', {
        title: 'Solution Decision Tree',
        code: `graph TD
    A[Start: ax² + bx + c = 0] --> B{Calculate Δ = b² - 4ac}
    B -->|Δ > 0| C[Two Real Distinct Roots]
    B -->|Δ = 0| D[One Real Repeated Root]
    B -->|Δ < 0| E[Two Complex Conjugate Roots]
    C --> F[Complete Factorization]
    D --> F
    E --> F`
      });
    }

    async function testAddFormula() {
      await executeAction('create_formula', {
        formula: 'a² + b² = c²',
        title: 'Pythagoras',
        steps: ['3² + 4² = 9 + 16 = 25', 'c = √25 = 5']
      });
    }

    async function testAddSticky() {
      await executeAction('create_sticky_note', {
        content: 'Check angle: Hypotenuse is always opposite the 90° angle!',
        title: 'Key Rule',
        color: 'yellow'
      });
    }

    async function testAddDiagram() {
      await executeAction('create_diagram', {
        title: 'Resolution Steps',
        nodes: [{ label: '1. Identify a and b' }, { label: '2. Compute a² + b²' }, { label: '3. Take square root √' }]
      });
    }

    async function testAddGraph() {
      await executeAction('create_graph', {
        equation: 'y = x² - 4',
        graph_type: 'function',
        title: 'Parabola Curve'
      });
    }

    function getLastElementId(type = null) {
      const arr = Array.from(bridge.elements.values());
      const filtered = type ? arr.filter(e => e.type === type) : arr.filter(e => e.type !== 'stroke');
      return filtered.length ? filtered[filtered.length - 1].id : null;
    }

    async function testUnderline() {
      const lastId = getLastElementId();
      if (!lastId) return alert('Draw an element first!');
      await executeAction('underline_element', { target_id: lastId });
    }

    async function testCircle() {
      const lastId = getLastElementId();
      if (!lastId) return alert('Draw an element first!');
      await executeAction('circle_element', { target_id: lastId });
    }

    async function testArrow() {
      const arr = Array.from(bridge.elements.values()).filter(e => e.type !== 'stroke');
      if (arr.length < 2) return alert('Draw at least 2 elements first!');
      await executeAction('draw_arrow', { from_id: arr[arr.length - 2].id, to_id: arr[arr.length - 1].id, label: 'leads to' });
    }

    async function testAnnotate() {
      const lastId = getLastElementId();
      if (!lastId) return alert('Draw an element first!');
      await executeAction('annotate_element', { target_id: lastId, text: 'Fundamental geometry theorem!' });
    }

    async function updateSpatialDigest() {
      try {
        const r = await fetch('/api/spatial');
        const data = await r.json();
        const digest = document.getElementById('spatial-digest');
        digest.innerText = data.context_prompt;
      } catch (e) {}
    }

    async function runTeachingLesson() {
      await executeAction('clear_canvas');
      await executeAction('write_text', { title: 'Lesson Goal', text: 'Quadratic Equations' });
      const fRes = await executeAction('create_formula', {
        formula: 'ax² + bx + c = 0',
        title: 'Standard Form',
        steps: ['x = (−b ± √(b² − 4ac)) / 2a']
      });
      const eqId = fRes.id;
      await executeAction('underline_element', { target_id: eqId, color: '#dc2626' });
      const gRes = await executeAction('create_graph', {
        equation: 'y = x² - 3x + 2',
        title: 'Roots at x = 1 and 2',
        anchor_id: eqId,
        direction: 'right'
      });
      await executeAction('draw_arrow', { from_id: eqId, to_id: gRes.id, label: 'Plots as' });
      const noteRes = await executeAction('create_sticky_note', {
        content: 'If discriminant Δ < 0, no real roots!',
        title: 'Pro Tip',
        color: 'yellow',
        anchor_id: eqId,
        direction: 'bottom'
      });
      await executeAction('circle_element', { target_id: noteRes.id, color: '#f59e0b' });
      setTimeout(fitView, 250);
    }

    // Initial load: fetch drawings and auto-fit to visible screen
    window.addEventListener('load', () => {
      bridge.fetchState().then(() => {
        updateSpatialDigest();
        setTimeout(fitView, 150);
      });
    });
    setTimeout(() => {
      bridge.fetchState().then(() => {
        updateSpatialDigest();
        setTimeout(fitView, 150);
      });
    }, 300);
  </script>
</body>
</html>
